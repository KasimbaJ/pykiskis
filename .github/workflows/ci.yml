name: CI

# Lint, type-check/build, and unit-test on every PR to master (and on master
# itself). Keeps regressions out before the deploy workflow runs on master.
# Note: the real-Python content gates (qa-verify.ts, trace-test.ts) need a local
# Python `py` launcher and stay as local/human checks — they are not run here.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
      - name: Unit tests
        run: npm test
